<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="外部AIアプリはOAuth認証でNext.jsのMCPを呼ぶ。Next.jsはClerkで本人を確認し、内部キーと検証済み本人IDをConvexへ渡す。Convexは所属世帯を照合し、支出データを読取り専用で返す。">
  <title>外部AIから世帯データを照会するMCPの経路</title>
  <desc>外部AIアプリからNext.jsの/mcpへOAuth認証付きで質問する。Clerkで検証した本人のIDと内部キーをConvexのHTTP APIに送る。OAuthトークンはConvexへ転送しない。Convexは内部キーと本人の世帯所属を確認して、未精算差額、支出一覧、月次集計、品目内訳を読み取る。支出データは変更しない。</desc>
  <defs>
    <marker id="mcp-data-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 7 3.5 0 7Z" fill="var(--accent)"/>
    </marker>
  </defs>
  <g font-family="var(--font-sans, sans-serif)" fill="var(--ink)">
    <g>
      <rect x="20" y="58" width="130" height="122" rx="10" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
      <path d="M71 76H99V95H86L79 101V95H71Z" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M77 83H93M77 89H87" fill="none" stroke="var(--accent)" stroke-width="1.3"/>
      <text x="85" y="132" text-anchor="middle" font-size="11.5" font-weight="700">外部AIアプリ</text>
      <text x="85" y="155" text-anchor="middle" font-size="10.5" fill="var(--muted)">質問・照会</text>
    </g>

    <path d="M150 120H198" fill="none" stroke="var(--accent)" stroke-width="1.7" marker-end="url(#mcp-data-arrow)"/>
    <text x="175" y="106" text-anchor="middle" font-size="9.5" fill="var(--ok)">OAuth認証</text>

    <g>
      <rect x="200" y="58" width="130" height="122" rx="10" fill="var(--paper)" stroke="var(--ok)" stroke-width="1.5"/>
      <path d="M265 74L278 79V87C278 95 271 100 265 103C259 100 252 95 252 87V79Z" fill="var(--paper-dim)" stroke="var(--ok)" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M259 87L264 92 272 83" fill="none" stroke="var(--ok)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="265" y="132" text-anchor="middle" font-size="12" font-weight="700">Next.js の /mcp</text>
      <text x="265" y="155" text-anchor="middle" font-size="10.5" fill="var(--muted)">Clerkで本人確認</text>
    </g>

    <path d="M330 120H378" fill="none" stroke="var(--accent)" stroke-width="1.7" marker-end="url(#mcp-data-arrow)"/>
    <text x="355" y="91" text-anchor="middle" font-size="9.5" fill="var(--accent)">内部キー＋</text>
    <text x="355" y="106" text-anchor="middle" font-size="9.5" fill="var(--accent)">本人のID</text>

    <g>
      <rect x="380" y="58" width="136" height="122" rx="10" fill="var(--paper)" stroke="var(--ok)" stroke-width="1.5"/>
      <path d="M440 86V81A8 8 0 0 1 456 81V86" fill="none" stroke="var(--ok)" stroke-width="1.4"/>
      <rect x="436" y="86" width="24" height="18" rx="3" fill="var(--paper-dim)" stroke="var(--ok)" stroke-width="1.4"/>
      <path d="M444 94L447 97 453 91" fill="none" stroke="var(--ok)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="448" y="132" text-anchor="middle" font-size="11.5" font-weight="700">Convex の通信窓口</text>
      <text x="448" y="155" text-anchor="middle" font-size="10.5" fill="var(--muted)">内部キーを確認</text>
    </g>

    <path d="M516 120H564" fill="none" stroke="var(--accent)" stroke-width="1.7" marker-end="url(#mcp-data-arrow)"/>
    <text x="541" y="106" text-anchor="middle" font-size="9.5" fill="var(--ok)">所属を照合</text>

    <g>
      <rect x="566" y="58" width="114" height="122" rx="10" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.5"/>
      <path d="M608 80V100C608 105 638 105 638 100V80" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.3"/>
      <ellipse cx="623" cy="80" rx="15" ry="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.3"/>
      <path d="M608 90C608 95 638 95 638 90" fill="none" stroke="var(--accent)" stroke-width="1.3"/>
      <text x="623" y="132" text-anchor="middle" font-size="12" font-weight="700">世帯のデータ</text>
      <text x="623" y="155" text-anchor="middle" font-size="10.5" fill="var(--muted)">所属する世帯だけ</text>
    </g>

    <rect x="20" y="226" width="660" height="38" rx="8" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="350" y="251" text-anchor="middle" font-size="12" fill="var(--accent)">未精算差額 / 支出一覧 / 月次集計 / 品目内訳</text>
    <text x="350" y="286" text-anchor="middle" font-size="11" fill="var(--muted)">支出データは読取り専用</text>
  </g>
</svg>
