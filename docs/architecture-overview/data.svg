<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-label="世帯 couples を共通の所属先として、参加者 members と招待 invitations、画像と世帯の対応 uploads、支出 expenses、精算 settlements を保存する。品目 items は支出内の配列。精算時に対象支出の settlementId が精算記録を参照する。">
  <defs>
    <marker id="data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="var(--font-sans)" font-size="12.5" font-weight="400">
    <rect x="16" y="20" width="668" height="270" rx="12" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M38 44 48 36 58 44V57H42V44" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="70" y="46" fill="var(--ink)" font-weight="700">世帯</text>
    <text x="70" y="65" fill="var(--accent)" font-family="var(--font-mono)" font-size="10.5">couples</text>
    <text x="258" y="54" fill="var(--accent)" font-size="11.5">各データの coupleId が共通の世帯を参照</text>
    <path d="M38 82H662" stroke="var(--line)" stroke-width="1"/>

    <g>
      <rect x="38" y="103" width="190" height="68" rx="8" fill="var(--paper)" stroke="var(--accent)"/>
      <text x="54" y="130" fill="var(--ink)" font-weight="500">参加者・招待</text>
      <text x="54" y="150" fill="var(--muted)" font-family="var(--font-mono)" font-size="10.5">members / invitations</text>
    </g>

    <g>
      <rect x="38" y="201" width="190" height="68" rx="8" fill="var(--paper)" stroke="var(--accent)"/>
      <text x="54" y="228" fill="var(--ink)" font-weight="500">画像と世帯の対応</text>
      <text x="54" y="248" fill="var(--muted)" font-family="var(--font-mono)" font-size="10.5">uploads</text>
    </g>

    <g>
      <rect x="258" y="103" width="184" height="166" rx="8" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="274" y="130" fill="var(--ink)" font-weight="500">支出</text>
      <text x="274" y="150" fill="var(--muted)" font-family="var(--font-mono)" font-size="10.5">expenses</text>
      <rect x="274" y="177" width="152" height="74" rx="6" fill="var(--paper-dim)" stroke="var(--line)"/>
      <text x="289" y="207" fill="var(--ink)" font-size="11.5">品目（内包する配列）</text>
      <text x="289" y="229" fill="var(--accent)" font-family="var(--font-mono)" font-size="10.5">items[]</text>
    </g>

    <g>
      <text x="487" y="170" text-anchor="middle" fill="var(--accent)" font-size="10.5">精算時に関連付け</text>
      <text x="487" y="188" text-anchor="middle" fill="var(--muted)" font-family="var(--font-mono)" font-size="9.5">settlementId</text>
      <path d="M442 205H528" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#data-arrow)"/>
    </g>

    <g>
      <rect x="532" y="159" width="130" height="92" rx="8" fill="var(--paper)" stroke="var(--ok)" stroke-width="1.5"/>
      <path d="M546 175 550 179 557 170" fill="none" stroke="var(--ok)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="548" y="205" fill="var(--ink)" font-weight="500">精算記録</text>
      <text x="548" y="227" fill="var(--muted)" font-family="var(--font-mono)" font-size="10.5">settlements</text>
    </g>
  </g>
</svg>
