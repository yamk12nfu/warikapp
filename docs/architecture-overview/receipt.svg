<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-label="レシート画像を圧縮して世帯に登録し、AIで抽出した品目を下書き保存する。人が金額、支払者、負担割合を確認して確定保存すると、支出は精算対象になる。" font-family="IBM Plex Sans JP, Hiragino Kaku Gothic ProN, sans-serif">
  <defs>
    <marker id="receipt-arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="receipt-arrow-review" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="receipt-arrow-confirmed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--ok)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M134 124 H146" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#receipt-arrow-data)"/>
  <path d="M264 124 H288" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#receipt-arrow-data)"/>
  <path d="M406 124 H430" fill="none" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#receipt-arrow-review)"/>
  <path d="M548 124 H572" fill="none" stroke="var(--ok)" stroke-width="1.5" marker-end="url(#receipt-arrow-confirmed)"/>

  <g>
    <rect x="1" y="66" width="130" height="120" rx="10" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M54 84 H74 V118 L69 114 L64 118 L59 114 L54 118 Z" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M59 92 H69 M59 98 H69 M59 104 H66" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
    <text x="66" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">画像を登録</text>
    <text x="66" y="169" text-anchor="middle" font-size="9.5" fill="var(--muted)">圧縮して所属世帯に関連付け</text>
  </g>

  <g>
    <rect x="154" y="66" width="108" height="120" rx="10" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
    <rect x="191" y="87" width="30" height="29" rx="4" fill="var(--paper-dim)" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M197 96 H207 M197 102 H215 M197 108 H211" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M221 80 L224 87 L231 90 L224 93 L221 100 L218 93 L211 90 L218 87 Z" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="208" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">AIで品目を読取り</text>
    <text x="208" y="169" text-anchor="middle" font-size="9.5" fill="var(--muted)">税・値引き差額を調整</text>
  </g>

  <g>
    <rect x="296" y="66" width="108" height="120" rx="10" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/>
    <path d="M334 92 V111 C334 120 366 120 366 111 V92" fill="var(--paper-dim)" stroke="var(--warn)" stroke-width="1.5"/>
    <ellipse cx="350" cy="92" rx="16" ry="6" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/>
    <path d="M334 102 C334 110 366 110 366 102" fill="none" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="350" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">下書きを自動保存</text>
    <text x="350" y="169" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="400" fill="var(--muted)">expenses.save</text>
  </g>

  <g>
    <rect x="438" y="66" width="108" height="120" rx="10" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/>
    <circle cx="483" cy="93" r="7" fill="var(--paper-dim)" stroke="var(--warn)" stroke-width="1.5"/>
    <path d="M470 116 V112 C470 99 496 99 496 112 V116" fill="var(--paper-dim)" stroke="var(--warn)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M503 88 V114 M498 95 H508 M498 108 H508" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="503" cy="95" r="2.5" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/>
    <circle cx="503" cy="108" r="2.5" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/>
    <text x="492" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">人が確認・仕分け</text>
    <text x="492" y="169" text-anchor="middle" font-size="9.5" fill="var(--muted)">金額・支払者・負担割合</text>
  </g>

  <g>
    <rect x="580" y="66" width="108" height="120" rx="10" fill="var(--paper)" stroke="var(--ok)" stroke-width="2"/>
    <path d="M618 92 V111 C618 120 650 120 650 111 V92" fill="var(--paper-dim)" stroke="var(--ok)" stroke-width="1.5"/>
    <ellipse cx="634" cy="92" rx="16" ry="6" fill="var(--paper)" stroke="var(--ok)" stroke-width="1.5"/>
    <path d="M626 106 L632 112 L643 101" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="634" y="147" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink)">支出を確定保存</text>
    <text x="634" y="169" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="400" fill="var(--muted)">expenses.save</text>
  </g>

  <text x="350" y="231" text-anchor="middle" font-size="12" fill="var(--ink)">AIの結果は下書きで残し、人が確定した支出だけを精算する。</text>
</svg>
