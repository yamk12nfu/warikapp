schema_version: 1

project:
  name: "warikapp"
  type: "node"
  risk_level: "medium"
  owner: "yamk12nfu"

runtime:
  devcontainer: null

commands:
  setup: "npm ci"
  lint: "npm run lint"
  typecheck: "npx tsc --noEmit"
  test: ""
  build: "npm run build"

quality_gates:
  required:
    - lint
    - typecheck
    - build

ai:
  max_loops: 4
  # フェーズ単位のPR(リネーム含む)が通る現実的な上限(Phase 3実績: 31ファイル)
  max_changed_files: 40
  allowed_paths:
    - "app/**"
    - "convex/**"
    - "docs/**"
    - "components/**" # UIコンポーネント(実装計画の正式構成)
    - "lib/**" # 共有ロジック(実装計画の正式構成)
    - "proxy.ts" # Next.js 16規約でルート直下必須
    - ".claude/**" # Claude Codeの設定・skills・agents
    - ".mcp.json" # プロジェクトMCP設定
    - ".ai/local/knowledge/**" # Repo Knowledgeのみ(project.yaml/managed/lockはAIの書き込み対象外)
    - ".ai/local/proposals/**" # knowledge-harvest のproposal(採否は人間がstatusで管理)
    - "package.json"
    - "package-lock.json"
    - "tsconfig.json"
    - "*.config.*" # next/eslint/postcss/vitest等のルート設定ファイル
  forbidden_paths:
    - ".env"
    - "secrets/**"
    - "infra/prod/**"
    - ".github/workflows/**"

review:
  create_pr: true
  require_human_review: true
  auto_merge: false

evals: {}
